# Starship — https://starship.rs/config
# Two-line prompt: the command always starts in the same column, no matter how
# long the path or the branch name is.

add_newline = true

# Left of the fill is where you are; right of it is what just happened. The
# split keeps the growing half (path, branch) from pushing the transient half
# (duration, exit status) off the line.
format = """
$directory$git_branch$git_status$python$nodejs$rust$fill$cmd_duration$status$jobs
$character"""

# Names, not colours. Every value below is an ANSI colour name, so the prompt
# resolves against whatever scheme the terminal is running -- today canonical
# "Catppuccin Mocha" from windows/terminal/settings.json. Writing hex here
# would mean a second copy of the palette that nothing keeps in step with the
# first, and a prompt that stops matching the moment the scheme moves.
palette = "terminal"

# Colours only. A palette entry is a colour, not a style: starship resolves
# "cyan" here but silently drops "bold cyan", leaving the module unstyled with
# no error anywhere. Modifiers therefore live on the modules, as "bold path".
[palettes.terminal]
path = "cyan"
vcs = "purple"
vcs_state = "yellow"
runtime_py = "yellow"
runtime_node = "green"
runtime_rust = "red"
ok = "green"
bad = "red"
# NOT bright-black. In a dark scheme that slot is low-contrast by design
# (2.46:1 here) -- it is what an application reaches for when it wants
# something to recede, not something to be read. cmd_duration below is read.
#
# Catppuccin puts bright-white (subtext0) BELOW white (subtext1), so it is the
# dimmer of the two light slots and still clears AA with room: 7.37:1. That is
# the one place this palette offers a genuine "de-emphasised but legible", and
# it is the same slot wsl/claude/statusline.sh uses for its labels, so the
# prompt and the line above it recede by the same amount. check.sh asserts the
# ordering holds, because it is Catppuccin's inversion and not a convention.
dim = "bright-white"

[character]
success_symbol = "[❯](bold ok)"
error_symbol = "[❯](bold bad)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold path"

[git_branch]
symbol = " "
style = "bold vcs"

[git_status]
style = "bold vcs_state"
# Only the actionable bits: conflicts, uncommitted changes, unpushed commits
conflicted = "⚠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "≡"

# A space, not the default "." leader. A row of dots across every prompt is
# texture competing with the output above it, and this prompt already has a
# statusline overhead. The alignment is the point; the fill is not.
[fill]
symbol = " "
style = "dim"

# Runtimes only show up inside a project that uses them.
# That way the prompt reflects what mise has actually activated.
[python]
symbol = " "
style = "bold runtime_py"
format = '[$symbol$version]($style) '

[nodejs]
symbol = " "
style = "bold runtime_node"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "bold runtime_rust"
format = '[$symbol$version]($style) '

# Warns when a command is slow: useful so you do not sit staring at the screen
[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "dim"

# Disabled by default, which is why a failing command left no trace in the
# prompt before. A non-zero exit is the one thing you most want to notice
# without re-reading the scrollback.
[status]
disabled = false
symbol = "✘"
format = '[$symbol$status]($style) '
style = "bold bad"

# Backgrounded jobs are easy to forget and easy to leave running.
[jobs]
symbol = "⚙"
style = "bold vcs_state"
number_threshold = 1
format = '[$symbol$number]($style) '
